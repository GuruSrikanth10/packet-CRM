name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          # config_validator skips its LLM-key check under pytest, but the
          # consumer/DLQ modules read Kafka config at import time.
          KAFKA_CONSUMER_BROKERS: localhost:9092
          PACKET_CRM_API_KEY: ci-test-key
          USE_MOCK_DB: "true"
          # Keep the Kubernetes leg out of CI: no cluster, so the chain would
          # fail fast on every fetch and add noise.
          LOG_SOURCE: elastic
        run: PYTHONPATH=. python -m pytest tests/ -q
